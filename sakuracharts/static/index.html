function cdUpdate(){/* ONE label: last price on top, bar-close countdown under it, same box (replaces the chart's own last-value label) */
  const el=$('cdown');if(!S.base.length||!S.agg.length){el.style.display='none';return;}const sec=S.tf*60,k=kAt(),a=S.agg[k];
  const now=S.replay?(S.tk?S.base[S.tk.i][0]+60*Math.min(1,S.tk.j/S.tk.n):curUT()+60):Date.now()/1000;
  const end=S.replay?a.ut+sec:Math.ceil((now+1e-6)/sec)*sec,rem=Math.max(0,Math.round(end-now)),showT=S.replay||isMktOpen(now);
  const p=lastClose(),y=Y(p),ps=chart.priceScale('right').width(),r=$('chart').getBoundingClientRect();if(y==null||y<0||y>r.height-chart.timeScale().height()||!ps){el.style.display='none';return;}
  const h=Math.floor(rem/3600),m=Math.floor(rem%3600/60),s2=rem%60,b=partial(a),c=themeColors(),txt=fmtP(p).replace(/,/g,'')+(showT?'|'+(h?p2(h)+':':'')+p2(m)+':'+p2(s2):'');
  if(el._t!==txt){el._t=txt;const [pp,tt]=txt.split('|');el.innerHTML=tt?`${pp}<span class="cdt">${tt}</span>`:pp;}
  el.style.background=b.close>=b.open?c.up:c.down;el.style.left=(r.width-ps)+'px';el.style.width=ps+'px';el.style.display='block';el.style.top=(y-9)+'px';}
(function cdLoop(){cdUpdate();requestAnimationFrame(cdLoop);})();

(()=>{const tip=$('tip');let tm=null,cur=null;const conv=root=>root.querySelectorAll('[title]').forEach(el=>{el.dataset.tip=el.getAttribute('title');el.removeAttribute('title');});

/* ===== UI batch 3: paper/replay order tools (working orders, bracket presets, Tradovate-style right-click, ghost preview, exit & cancel all)
   Everything here acts ONLY on this terminal's own paper / replay account (S.pos / S.orders in the browser). Nothing is sent to any broker. ===== */
const UNIT_NAME={usd:'$ value',pts:'Points',ticks:'Ticks'};
const BK_DEFAULT=[{name:'Default (2:1)',unit:'pts',per:'order',type:'both',tp:20,sl:10,stop:'fixed',beTrig:10,beOff:1},
  {name:'Auto breakeven $575',unit:'usd',per:'order',type:'both',tp:575,sl:575,stop:'be',beTrig:285,beOff:0}];
const BK={list:[],sel:0,saved:0};
(function bkLoad(){try{const j=JSON.parse(localStorage.getItem('sakuraBrackets')||'null');if(j&&Array.isArray(j.list)&&j.list.length)Object.assign(BK,j);}catch(e){}
  if(!BK.list.length)BK.list=dclone(BK_DEFAULT);
  fetch('/api/prefs').then(r=>r.json()).then(j=>{const b=j&&j.brackets;if(b&&Array.isArray(b.list)&&b.list.length&&(b.saved||0)>(BK.saved||0)){Object.assign(BK,b);localStorage.setItem('sakuraBrackets',JSON.stringify(BK));bkFill();}}).catch(()=>{});})();
function bkSave(){BK.saved=Date.now();localStorage.setItem('sakuraBrackets',JSON.stringify(BK));fetch('/api/prefs',{method:'POST',body:JSON.stringify({brackets:BK})}).catch(()=>{});bkFill();}
const bkCur=()=>BK.list[Math.min(BK.sel,BK.list.length-1)]||BK.list[0];
const ordQty=()=>Math.max(1,+$('qty').value|0);
/* distance in points for a preset value, respecting contract size (MNQ $2/pt) and quantity */
function toPts(P,v,qty){v=+v||0;if(P.unit==='ticks')return v*TICK;if(P.unit==='usd')return P.per==='contract'?v/PV():v/(PV()*Math.max(1,qty));return v;}
function fromPts(P,pts,qty){if(P.unit==='ticks')return pts/TICK;if(P.unit==='usd')return P.per==='contract'?pts*PV():pts*PV()*Math.max(1,qty);return pts;}
function bracketFor(dir,entry,qty,P){P=P||bkCur();const tpP=toPts(P,P.tp,qty),slP=toPts(P,P.sl,qty);
  return {tp:P.type!=='sl'&&tpP>0?rt(entry+dir*tpP):null,sl:P.type!=='tp'&&slP>0?rt(entry-dir*slP):null,stop:P.type==='tp'?'fixed':P.stop,beTrig:toPts(P,P.beTrig,qty),beOff:(+P.beOff||0)*TICK,trail:slP,preset:P.name};}
const usdS=v=>(v>=0?'+':'-')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const ptsS=v=>(v>=0?'+':'-')+Math.abs(v).toFixed(2)+' pts';
const sideName=d=>d>0?'Buy':'Sell',typeName=t=>t==='LMT'?'LIMIT':t==='STP'?'STOP':'MARKET';
S.orders=[];let OID=1;
function pendBracket(o){const B=bracketFor(o.dir,o.price,o.qty,o.preset);if(o.noTp)B.tp=null;if(o.noSl)B.sl=null;return B;}
function openPos(dir,qty,px,B,why){const p={sl0:B.sl,src:B.preset||'',dir,qty,entry:px,t:curUT(),tp:B.tp,sl:B.sl,stop:B.stop||'fixed',beTrig:B.beTrig,beOff:B.beOff||0,trail:B.trail,best:px,preset:B.preset||'',_new:true};
  p.le=addLine(px,dir>0?themeColors().up:themeColors().down);if(p.tp!=null)p.ltp=addLine(p.tp,'#089981');if(p.sl!=null)p.lsl=addLine(p.sl,'#f23645');
  S.pos.push(p);refreshLines(p);updPnl();dirty();return p;}
function placeOrder(dir,type,price){const qty=ordQty(),mk=lastClose();price=rt(price);
  if(type==='MKT'){market(dir);return;}
  const o={isOrder:true,id:OID++,dir,type,price,qty,t:curUT(),preset:dclone(bkCur())};
  o.line=ser.createPriceLine({price,color:dir>0?themeColors().up:themeColors().down,lineWidth:1,lineStyle:0,axisLabelVisible:true,title:''});
  S.orders.push(o);toast(`Paper order working: ${sideName(dir)} ${qty} ${typeName(type)} @ ${fmtP(price)} · bracket "${o.preset.name}"`);dirty();
  if(drawerView==='orders'&&$('drawer').classList.contains('open')){showOrders();showOrders();}return o;}
function cancelOrder(o,quiet){if(o.line)ser.removePriceLine(o.line);S.orders=S.orders.filter(x=>x!==o);if(!quiet)toast(`Cancelled ${sideName(o.dir)} ${o.qty} ${typeName(o.type)} @ ${fmtP(o.price)}`);dirty();
  if(!quiet&&drawerView==='orders'&&$('drawer').classList.contains('open')){showOrders();showOrders();}}
function cancelAllOrders(){const n=S.orders.length;S.orders.slice().forEach(o=>cancelOrder(o,true));return n;}
function flattenAll(){const ps=S.pos.slice(),px=lastClose();let usd=0;ps.forEach(p=>{usd+=(px-p.entry)*p.dir*p.qty*PV();closePos(p,px,'EXIT ALL');});const n=cancelAllOrders();
  const a=ps.length?`Exited ${ps.length} position${ps.length>1?'s':''} at market ${fmtP(px)} (${usdS(usd)})`:'No open position';const b=n?`cancelled ${n} working order${n>1?'s':''}`:'no working orders';
  toast(`${a} · ${b} · paper account`);const T=$('toast');clearTimeout(T._t);T._t=setTimeout(()=>T.style.display='none',4500);dirty();
  if(drawerView==='orders'&&$('drawer').classList.contains('open')){showOrders();showOrders();}}
/* ---------- order tags with X buttons, ghost preview, right-click line (drawn after every chart render) ---------- */
function tagHost(){let h=$('otags');if(!h){h=document.createElement('div');h.id='otags';$('main').appendChild(h);
  h.onclick=e=>{const b=e.target.closest('[data-ox]');if(!b)return;const [k,id]=b.dataset.ox.split(':');
    if(k==='o'){const o=S.orders.find(x=>x.id===+id);if(o)cancelOrder(o);}
    else if(k==='otp'||k==='osl'){const o=S.orders.find(x=>x.id===+id);if(o){o[k==='otp'?'noTp':'noSl']=true;toast(k==='otp'?'Take profit removed from the pending order':'Stop loss removed from the pending order - it will fill with no stop');dirty();}}
    else{const p=S.pos[+id];if(!p)return;if(k==='p'){closePos(p,lastClose(),'MKT');toast(`Exited ${p.dir>0?'LONG':'SHORT'} ${p.qty} at market ${fmtP(lastClose())}`);}
      else if(k==='tp'){if(p.ltp)ser.removePriceLine(p.ltp);p.ltp=null;p.tp=null;toast('Take profit cancelled');}
      else if(k==='sl'){if(p.lsl)ser.removePriceLine(p.lsl);p.lsl=null;p.sl=null;toast('Stop loss cancelled - position has no stop');}}
    updPnl();dirty();if(drawerView==='orders'&&$('drawer').classList.contains('open')){showOrders();showOrders();}};}return h;}
function rbox(x,y,t,bg,fg,align){ctx.font=`11px ${getComputedStyle(document.body).fontFamily}`;const w=ctx.measureText(t).width+10,h=16,bx=align==='right'?x-w:x;ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect?ctx.roundRect(bx,y-h/2,w,h,3):ctx.rect(bx,y-h/2,w,h);ctx.fill();ctx.fillStyle=fg;ctx.fillText(t,bx+5,y+4);}
function drawTrade(){if(!S.base||!S.base.length)return;const R=$('chart').getBoundingClientRect(),M=$('main').getBoundingClientRect(),psw=chart.priceScale('right').width(),W=R.width-psw,H=R.height-chart.timeScale().height();
  const hline=(p,col,dash,lw)=>{const y=Y(p);if(y==null||y<0||y>H)return null;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw||1;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.restore();return y;};
  /* right-click price line + axis label (only while the chart menu is open) */
  const cm=$('ctx');if(S.ctxLineP!=null&&cm.style.display==='block'&&S.ctxMode==='chart'){const g=S.ghost,col=g?(g.dir>0?themeColors().up:themeColors().down):'#d1d4dc';const y=hline(S.ctxLineP,col,g?[]:[4,3],g?1.5:1);
    if(y!=null)rbox(W+1,y,fmtP(S.ctxLineP),col,g?'#fff':'#000','left');}
  /* ghost preview: entry (solid, side colour) + take profit (green dotted) + stop loss (red dotted) with $ and points */
  const g=S.ghost;if(g){const qty=ordQty(),B=bracketFor(g.dir,g.price,qty),sc=g.dir>0?themeColors().up:themeColors().down;const ye=hline(g.price,sc,[],1.5);
    if(ye!=null)rbox(10,ye-12,`${sideName(g.dir)} ${qty} ${typeName(g.kind)} @ ${fmtP(g.price)} · ${B.preset}`,sc,'#fff','left');
    if(B.tp!=null){const d=(B.tp-g.price)*g.dir,y=hline(B.tp,'#26a69a',[2,3],1.5);if(y!=null)rbox(10,y-11,`Take profit ${usdS(d*qty*PV())} (${ptsS(d)})`,'rgba(8,153,129,.92)','#fff','left');}
    if(B.sl!=null){const d=(B.sl-g.price)*g.dir,y=hline(B.sl,'#ef5350',[2,3],1.5);const st=B.stop==='be'?' · auto breakeven':B.stop==='trail'?' · trailing':'';if(y!=null)rbox(10,y+11,`Stop loss ${usdS(d*qty*PV())} (${ptsS(d)})${st}`,'rgba(242,54,69,.92)','#fff','left');}
    if(B.stop==='be'&&B.sl!=null&&B.beTrig>0){const pb=g.price+g.dir*B.beTrig,y=hline(pb,'#ffeb3b',[1,4],1);if(y!=null)rbox(10,y-11,`Stop moves to breakeven at ${usdS(B.beTrig*qty*PV())} (${ptsS(B.beTrig)})`,'rgba(60,55,10,.9)','#ffeb3b','left');}}
  /* DOM tags: working orders + positions, each with an X */
  const h=tagHost(),top=R.top-M.top,right=M.right-R.right+psw+4,parts=[];
  const tag=(p,cls,txt,ox,tip)=>{const y=Y(p);if(y==null||y<-8||y>H+8)return;parts.push({y,h:`<span>${txt}</span><b data-ox="${ox}" data-tip="${tip}" title="${tip}">✕</b>`,cls});};
  for(const o of S.orders){tag(o.price,o.dir>0?'buy':'sell',`${sideName(o.dir)} ${o.qty} ${typeName(o.type)} @ ${fmtP(o.price)}`,'o:'+o.id,'Cancel this working order (and its bracket)');
    const B=pendBracket(o);/* attached bracket, shown dotted until the parent fills; cancelled with the parent */
    if(B.tp!=null){hline(B.tp,'#26a69a',[2,3],1);tag(B.tp,'tp pend',`Pending take profit ${usdS((B.tp-o.price)*o.dir*o.qty*PV())}`,'otp:'+o.id,'Remove the take profit from this pending order');}
    if(B.sl!=null){hline(B.sl,'#ef5350',[2,3],1);tag(B.sl,'sl pend',`Pending stop loss ${usdS((B.sl-o.price)*o.dir*o.qty*PV())}`,'osl:'+o.id,'Remove the stop loss from this pending order');}}

  if(server!==false){clearTimeout(layPersist._t);layPersist._t=setTimeout(()=>{const b=JSON.stringify({layouts:LAY});if(b.length<190000)fetch('/api/prefs',{method:'POST',body:b}).catch(()=>{});},1200);}}
(function layLoad(){try{const j=JSON.parse(localStorage.getItem('sakuraLayouts')||'null');if(j&&j.list){LAY.cur=j.cur;LAY.list=j.list;LAY.saved=j.saved||0;}}catch(e){}
  const n=layName();LAY.cur=n;LAY.list[n]={draw:JSON.parse(JSON.stringify(S.draw||[])),t:Date.now()};layPersist(false);
  fetch('/api/prefs').then(r=>r.json()).then(j=>{const d=j&&j.layouts;if(!d||!d.list)return;let ch=false;for(const k in d.list){if(k===LAY.cur)continue;const a=LAY.list[k],b=d.list[k];if(!a||(b&&(b.t||0)>(a.t||0))){LAY.list[k]=b;ch=true;}}if(ch)layPersist(false);}).catch(()=>{});})();
{const _save=save;save=function(){const r=_save.apply(this,arguments);try{const n=layName();if(LAY.cur!==n){if(LAY.cur&&LAY.list[LAY.cur]&&!LAY.list[n]){LAY.list[n]=LAY.list[LAY.cur];delete LAY.list[LAY.cur];}LAY.cur=n;}LAY.list[n]={draw:JSON.parse(JSON.stringify(S.draw||[])),t:Date.now()};layPersist();}catch(e){}return r;};}
function laySwitch(n){if(!LAY.list[n]||n===LAY.cur)return;save();S.draw=JSON.parse(JSON.stringify(LAY.list[n].draw||[]));S.sel=null;S.pending=null;S.undo=[];S.redo=[];LAY.cur=n;q('lname').textContent=n;save();dirty();toast('Layout: '+n);}
function layNew(n,copy){n=(n||'').trim();if(!n)return;if(LAY.list[n]){toast('A layout called "'+n+'" already exists');return;}save();
  LAY.list[n]={draw:copy?JSON.parse(JSON.stringify(S.draw||[])):[],t:Date.now()};S.draw=JSON.parse(JSON.stringify(LAY.list[n].draw));S.sel=null;S.pending=null;S.undo=[];S.redo=[];LAY.cur=n;q('lname').textContent=n;save();dirty();toast((copy?'Saved copy: ':'New layout: ')+n);}
function layRename(o,n){n=(n||'').trim();if(!n||n===o)return;if(LAY.list[n]){toast('A layout called "'+n+'" already exists');return;}LAY.list[n]=LAY.list[o];delete LAY.list[o];if(LAY.cur===o){LAY.cur=n;q('lname').textContent=n;save();}else layPersist();}
function layDel(n){if(n===LAY.cur||!LAY.list[n])return;delete LAY.list[n];layPersist();}
function layMenu(anchor){let M=q('layMenu');if(!M){M=document.createElement('div');M.id='layMenu';M.className='glass';document.body.appendChild(M);
    ['mousedown','click','keydown'].forEach(t=>M.addEventListener(t,e=>e.stopPropagation()));}
  if(M.style.display==='block'&&M._a===anchor){layClose();return;}M._a=anchor;
  const names=Object.keys(LAY.list).sort((a,b)=>a===LAY.cur?-1:b===LAY.cur?1:a.localeCompare(b));
  const draw=(edit)=>{M.innerHTML=`<div class="lmH">Layouts</div><div class="lmL">${names.map(n=>edit&&edit.ren===n?`<div class="lmI"><input id="lmRen" value="${esc(n)}"></div>`:
      `<div class="lmI ${n===LAY.cur?'cur':''}" data-n="${esc(n)}" title="${n===LAY.cur?'Current layout':'Switch to this layout'}"><i class="fa-solid fa-check lmC" style="visibility:${n===LAY.cur?'visible':'hidden'}"></i><span class="lmN">${esc(n)}</span><span style="color:var(--muted);font-size:10px">${(LAY.list[n].draw||[]).length}</span><i class="fa-solid fa-pen lmX" data-ren="${esc(n)}" title="Rename"></i>${n===LAY.cur?'':`<i class="fa-solid fa-trash-can lmX" data-del="${esc(n)}" title="Delete (click twice)"></i>`}</div>`).join('')}</div>
    <div class="lmS"></div>${edit&&edit.add?`<div class="lmI"><input id="lmNew" placeholder="${edit.add==='copy'?'Name for the copy':'New layout name'}"></div>`:''}
    <div class="lmA" data-act="new"><i class="fa-regular fa-square-plus"></i> New layout (blank)</div><div class="lmA" data-act="copy"><i class="fa-regular fa-clone"></i> Save a copy as…</div><div class="lmA" data-act="ren"><i class="fa-solid fa-pen"></i> Rename current</div>`;
    const ri=q('lmRen');if(ri){ri.focus();ri.select();ri.onkeydown=e=>{if(e.key==='Enter'){layRename(edit.ren,ri.value);names.splice(0,names.length,...Object.keys(LAY.list).sort((a,b)=>a===LAY.cur?-1:b===LAY.cur?1:a.localeCompare(b)));draw();}if(e.key==='Escape')draw();};}
    const ni=q('lmNew');if(ni){ni.focus();ni.onkeydown=e=>{if(e.key==='Enter'){layNew(ni.value,edit.add==='copy');layClose();}if(e.key==='Escape')draw();};}
    M.querySelectorAll('[data-n]').forEach(r=>r.onclick=e=>{if(e.target.closest('.lmX'))return;laySwitch(r.dataset.n);layClose();});
    M.querySelectorAll('[data-ren]').forEach(b=>b.onclick=e=>{e.stopPropagation();draw({ren:b.dataset.ren});});
    M.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(!b.classList.contains('arm')){b.classList.add('arm');b.title='Click again to delete';setTimeout(()=>b.classList.remove('arm'),3000);return;}
      layDel(b.dataset.del);names.splice(names.indexOf(b.dataset.del),1);draw();});
    M.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='ren')draw({ren:LAY.cur});else draw({add:a});});};
  draw();M.style.display='block';const r=anchor.getBoundingClientRect(),w=M.offsetWidth;M.style.left=Math.max(4,Math.min(innerWidth-w-4,r.left))+'px';M.style.top=(r.bottom+4)+'px';
  setTimeout(()=>{document.addEventListener('mousedown',layClose,{once:true});},0);}
function layClose(){const M=q('layMenu');if(M)M.style.display='none';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')layClose();});
q('lname').title='Layouts: switch, create, rename';
{const g=q('gear');if(g)g.onclick=()=>showSettings();}
q('lname').onclick=e=>{e&&e.stopPropagation&&e.stopPropagation();const l=q('lname');layMenu(l.offsetWidth?l:(q('topMore')||l));};
window.layMenu=layMenu;
/* ---------- 2. drawing colour from the right-click menu = the same picker as Settings > Color ---------- */
window.drawColorPick=function(d){document.querySelectorAll('input.ui3cp').forEach(x=>x.remove());const key=d.type==='fib'?'line':'color',cur=d[key]||(d.type==='fib'?'#787b86':'#2962ff');
  const inp=document.createElement('input');inp.type='color';inp.value=cpParse(cur).hex;inp.style.cssText=`position:fixed;left:${(S.ctxX||200)}px;top:${(S.ctxY||200)}px;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0`;
  document.body.appendChild(inp);let undo=false;
  inp.addEventListener('input',()=>{if(!undo){pushUndo();undo=true;}d[key]=inp.value;save();dirty();if(d.type!=='pos'&&d.type!=='fib')remember(d);});
  inp.className='ui3cp';inp.addEventListener('change',()=>setTimeout(()=>inp.remove(),50));
  try{inp.showPicker?inp.showPicker():inp.click();}catch(e){inp.click();}};
/* ---------- 5. text size ---------- */
const TS_PRESET={s:0.9,m:1,l:1.15};
function tsGet(){try{const j=JSON.parse(localStorage.getItem('sakuraTextSize')||'null');if(j&&j.mode)return j;}catch(e){}return {mode:'m',pct:100,z:1};}
function tsApply(o,persist){const z=o.mode==='c'?Math.max(0.7,Math.min(1.6,(+o.pct||100)/100)):TS_PRESET[o.mode]||1;o.z=+z.toFixed(3);document.documentElement.style.setProperty('--uiz',String(o.z));
  try{chart.applyOptions({layout:{fontSize:Math.round(11*o.z)}});}catch(e){}
  if(persist){o.saved=Date.now();localStorage.setItem('sakuraTextSize',JSON.stringify(o));fetch('/api/prefs',{method:'POST',body:JSON.stringify({ui:{textSize:o}})}).catch(()=>{});}
  try{window.__fitTop&&window.__fitTop();}catch(e){}setTimeout(()=>{try{dirty();legTop();}catch(e){}},60);}
window.tsApply=tsApply;tsApply(tsGet(),false);
fetch('/api/prefs').then(r=>r.json()).then(j=>{const t=j&&j.ui&&j.ui.textSize;const L=tsGet();if(t&&t.mode&&(t.saved||0)>(L.saved||0)){localStorage.setItem('sakuraTextSize',JSON.stringify(t));tsApply(t,false);}}).catch(()=>{});
{const _s=showSettings;showSettings=function(){const r=_s.apply(this,arguments);try{const th=q('s_theme');if(th&&!q('s_tsz')){const o=tsGet();
    th.insertAdjacentHTML('afterend',`<label>Text size (whole interface)</label><div class="ui3ts"><select id="s_tsz"><option value="s">Small</option><option value="m">Medium</option><option value="l">Large</option><option value="c">Custom</option></select><input id="s_tszc" type="number" min="70" max="160" step="5" title="Custom size in %" style="display:none"></div>`);
    const s=q('s_tsz'),c=q('s_tszc');s.value=o.mode;c.value=Math.round((o.mode==='c'?o.pct:(TS_PRESET[o.mode]||1)*100));c.style.display=o.mode==='c'?'':'none';try{cselUp(s);}catch(e){}
    s.onchange=()=>{c.style.display=s.value==='c'?'':'none';tsApply({mode:s.value,pct:+c.value||100},true);};c.onchange=()=>{const v=Math.max(70,Math.min(160,+c.value||100));c.value=v;tsApply({mode:'c',pct:v},true);};}
    const lco=null;if(lco&&!q('s_ofr')){const lab=document.createElement('label');lab.textContent='Order flow panes';const b=document.createElement('button');b.className='pbtn';b.type='button';b.id='s_ofr';b.style.justifySelf='start';b.innerHTML='<i class="fa-solid fa-arrow-rotate-left"></i>Reset order flow';b.onclick=()=>ofReset();
      const anchor=lco;anchor.after(b);anchor.after(lab);}}catch(e){console.error(e);}return r;};}
/* ---------- 6. legend right under the OHLC header (no empty row that looks like a hidden indicator) ---------- */
function legTop(){const L=q('tvLeg'),M=q('main');if(!L||!M)return;const mt=M.getBoundingClientRect().top;let b=0;
  for(const id of ['hdr','hdr2']){const e=q(id);if(!e)continue;if(!(e.innerText||'').trim())continue;const r=e.getBoundingClientRect();if(r.height)b=Math.max(b,r.bottom-mt);}
  const z=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--uiz'))||1;const top=Math.round(((b||26)+3)/z);if(L.style.top!==top+'px')L.style.top=top+'px';}
window.legTop=legTop;
setInterval(legTop,1500);setTimeout(legTop,900);
/* ---------- 8. short popups: narrow + centred ---------- */
{const _m=modal;modal=function(html){const r=_m.apply(this,arguments);try{const D=q('dlg');D.classList.remove('dlgN');
    if(!D.querySelector('.frm,table,textarea,.dsDlg,.bkDlg,.jrWrap,#mon,canvas,[style*="width:min"]')&&(D.innerText||'').length<700)D.classList.add('dlgN');}catch(e){}return r;};}
/* ---------- 11. Orders panel compact ---------- */
{const _d=drawer;drawer=function(v){const r=_d.apply(this,arguments);try{q('drawer').classList.toggle('ui3orders',drawerView==='orders');}catch(e){}return r;};}
/* ---------- 13. left-click order popup = toggle (2nd click hides it, never re-opens it) ---------- */
{const C=q('chart').parentElement;let wasOpen=false,at=0;
  window.addEventListener('mousedown',e=>{const m=q('ctx');wasOpen=e.button===0&&m.style.display==='block'&&m.classList.contains('ctxMini')&&!e.target.closest('#ctx');at=Date.now();},true);
  const _o=openOrderMenu;openOrderMenu=function(){if(wasOpen&&Date.now()-at<1500){wasOpen=false;return;}return _o.apply(this,arguments);};}
})();
